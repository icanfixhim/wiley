      <div class="parcel object object-book">
        <span class="object-glow"></span>
        <svg class="bag-layer tied" viewBox="0 0 220 178" aria-hidden="true"><g class="bag-body"><use href="#book-bag" fill="url(#plastic)" stroke="#1b2725" stroke-width="2"/><use href="#creases"/></g><g class="bag-knot"><use href="#knot"/></g></svg>
        <svg class="bag-layer mouth-back" viewBox="0 0 220 178" aria-hidden="true"><g transform="translate(0 -68) scale(1 1.47)"><use href="#back-rim"/></g></svg>
        <button class="bag-handle" type="button" aria-label="각진 봉투 열기"></button>
        <button class="find" type="button" data-character="grant" aria-label="버려진 책: 그랜트 와일리 봇 보기" hidden>
        <svg viewBox="0 0 220 178" aria-hidden="true" focusable="false">
          <path d="m84 40 112 21-62 101-114-22z" fill="#2e4944" stroke="#192a29" stroke-width="2"/>
          <path d="m83 27 110 20-61 100-107-21 1 12 107 21 61-99V47" fill="#cabca2"/>
          <path d="m132 147 61-100v13l-61 99z" fill="#ac9d83"/>
          <path d="m28 129 102 20m-102-16 101 20m7-4 53-86m-52 90 52-85" fill="none" stroke="#887f6c" stroke-width="1" opacity=".66"/>

              <text x="23" y="31" font-size="15" textLength="87" lengthAdjust="spacingAndGlyphs">Love Is Not a</text>
              <text x="23" y="61" font-size="22" textLength="89" lengthAdjust="spacingAndGlyphs">Zero-Sum</text>
              <text x="22" y="87" font-size="26" letter-spacing="-1">Game</text>
            </g>
            <path d="M24 99h88" stroke="#968e75"/>
            <circle cx="58" cy="127" r="22" fill="#526c61"/>
            <circle cx="78" cy="127" r="22" fill="none" stroke="#ae684d" stroke-width="4"/>
          </g>
          <path d="m21 125 9 2v13l-8-2q-3-6-1-13z" fill="#354c45"/>
        </svg>
        </button>
        <svg class="bag-layer mouth-front" viewBox="0 0 220 178" aria-hidden="true"><use href="#front-rim"/></svg>
      </div>

      <div class="parcel object object-tags">
        <span class="object-glow"></span>
        <svg class="bag-layer tied" viewBox="0 0 220 178" aria-hidden="true"><g class="bag-body"><use href="#tags-bag" fill="url(#plastic)" stroke="#1b2725" stroke-width="2"/><use href="#creases"/></g><g class="bag-knot"><use href="#knot"/></g></svg>
        <svg class="bag-layer mouth-back" viewBox="0 0 220 178" aria-hidden="true"><use href="#back-rim"/></svg>
        <button class="bag-handle" type="button" aria-label="옆으로 누운 봉투 열기"></button>
        <button class="find" type="button" data-character="luke" aria-label="군번줄: 루크 와일리 봇 보기" hidden>
        <svg viewBox="0 0 220 178" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="tag-steel" x2=".85" y2="1"><stop stop-color="#83908a"/><stop offset=".38" stop-color="#b8beb0"/><stop offset=".5" stop-color="#a6aea1"/><stop offset="1" stop-color="#707d77"/></linearGradient>
            <path id="bead-loop" d="M80 87C47 86 24 59 38 40c13-18 34-9 55-19 25-11 72-3 80 19 10 27-23 41-38 49"/>
          </defs>
          <g fill="none">
            <use href="#bead-loop" stroke="#434e49" stroke-width="2"/>
            <use href="#bead-loop" stroke="#abb0a0" stroke-width="3.7" stroke-linecap="round" stroke-dasharray=".35 5"/>
          </g>
          <g transform="translate(125 69) rotate(31)">
            <rect width="40" height="71" rx="12" fill="#747e75" stroke="#414b46" stroke-width="2"/>
            <rect x="3" y="3" width="34" height="64" rx="9" fill="none" stroke="#a5ac9c"/>

          <g transform="translate(62 85) rotate(-28)">

            <circle cx="19" cy="10" r="3.8" fill="#344039" stroke="#c6ccbc"/>
            <g font-family="monospace" font-size="8" font-weight="bold" fill="#58655d">

        </button>
        <svg class="bag-layer mouth-front" viewBox="0 0 220 178" aria-hidden="true"><use href="#front-rim"/></svg>
      </div>

      <div class="parcel object object-ring">
        <span class="object-glow"></span>
        <svg class="bag-layer tied" viewBox="0 0 220 178" aria-hidden="true"><g class="bag-body"><use href="#ring-bag" fill="url(#plastic)" stroke="#1b2725" stroke-width="2"/><use href="#creases"/></g><g class="bag-knot"><use href="#knot"/></g></svg>
        <svg class="bag-layer mouth-back" viewBox="0 0 220 178" aria-hidden="true"><use href="#back-rim"/></svg>
        <button class="bag-handle" type="button" aria-label="작고 둥근 봉투 열기"></button>
        <button class="find" type="button" data-character="eric" aria-label="전달하지 못한 반지: 에릭 와일리 봇 보기" hidden>

          <g transform="matrix(.95 .16 -.4 .38 76 91)">

        </svg>
        </button>
        <svg class="bag-layer mouth-front" viewBox="0 0 220 178" aria-hidden="true"><use href="#front-rim"/></svg>
      </div>
    </main>

    <dialog id="pickup-dialog" aria-labelledby="card-name">
      <section id="pickup-card">
        <button type="button" id="card-close" aria-label="카드 닫기">×</button>
        <article class="paper-card">
          <p class="card-ref" data-field="number"></p>
          <div class="card-heading">
            <button type="button" id="photo-frame" aria-label="사진 크게 보기" aria-haspopup="dialog" disabled></button>
            <div>
              <p class="card-item" data-field="name"></p>
              <h2 id="card-name" lang="en" data-field="english"></h2>
              <p class="card-meta" lang="en" data-field="meta"></p>
            </div>
          </div>
          <p class="card-quote" data-field="quote"></p>
          <p class="card-description" data-field="description"></p>
        </article>
        <div class="card-actions">
          <button type="button" data-reading="sheet" data-reader-label="Description">설명</button>
          <button type="button" data-reading="greeting" data-reader-label="Greeting">그리팅</button>
          <button type="button" id="take-card">주워가기</button>
        </div>
        <p id="card-status" role="status"></p>
      </section>
      <section id="card-reader" hidden>
        <div class="reader-toolbar">
          <button type="button" id="reader-back">← 돌아가기</button>
        </div>
        <article class="reader-page">
          <h2 id="reader-title" tabindex="-1"></h2>
          <div id="reader-text"></div>
        </article>
      </section>
    </dialog>
    <dialog id="portrait-dialog" aria-label="사진 크게 보기">
      <button id="portrait-close" type="button" aria-label="사진 닫기" autofocus><span aria-hidden="true">×</span></button>
      <img id="portrait-image" alt="" />
      <p id="portrait-status" role="status"></p>
    </dialog>
    <dialog id="pickup-confirm" aria-labelledby="pickup-question">
      <h2 id="pickup-question">정말 주워가시겠습니까?</h2>
      <div class="choice-row">
        <a id="pickup-yes" download aria-disabled="true">예</a>
        <button type="button" id="pickup-no" autofocus>아니오</button>
      </div>
      <p id="pickup-status" role="status"></p>
    </dialog>
  <script>
      document.querySelectorAll(".bag-handle").forEach(handle => {
        handle.addEventListener("click", () => {
          const parcel = handle.closest(".parcel");
          const item = parcel.querySelector(".find");
          parcel.classList.add("is-open");
          handle.hidden = true;
          item.hidden = false;
          item.focus({ preventScroll: true });
        });
      });
    </script>
  </body>
</html>
